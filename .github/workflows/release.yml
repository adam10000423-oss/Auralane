name: Release Auralane

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare optional local translation directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/local-translate/runtime | Out-Null
          New-Item -ItemType Directory -Force vendor/local-translate/models | Out-Null
      - run: npm run dist -- --win --publish never
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Auralane-Windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/SHA256SUMS-windows.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Auralane 1.0.3
          body_path: .github/release-notes/${{ github.ref_name }}.md
          make_latest: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/SHA256SUMS-windows.txt

  macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --mac --${{ matrix.arch }} --publish never
      - name: Generate macOS checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > "SHA256SUMS-macos-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Auralane-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Auralane 1.0.3
          body_path: .github/release-notes/${{ github.ref_name }}.md
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
